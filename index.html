<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplified General Equivalency Modeling</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #f4f3f0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-family: 'Georgia', serif;
}
.title-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  border-bottom: 1px solid #d0cec9;
  flex-shrink: 0;
  position: relative;
}
.title-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.page-title {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.26em;
  color: #666;
  text-transform: uppercase;
}
.page-subtitle {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.18em;
  color: #999;
  text-transform: uppercase;
  font-family: 'Courier New', monospace;
}
.controls {
  position: absolute;
  right: 20px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.ctrl-btn {
  font-family: 'Courier New', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: #aaa;
  border: 1px solid #ccc;
  padding: 4px 9px;
  cursor: pointer;
  user-select: none;
  background: none;
}
.ctrl-btn:hover { color: #444; border-color: #888; }
.ctrl-btn.off   { color: #ccc; border-color: #e0e0e0; }
#stage {
  flex: 1;
  position: relative;
  overflow: hidden;
}
canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div class="title-bar">
  <div class="title-stack">
    <span class="page-title">Simplified General Equivalency Modeling</span>
    <span class="page-subtitle">Valuation Manifold</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="resBtn">RES (1)</button>
    <button class="ctrl-btn" id="animBtn">ANIM ON</button>
  </div>
</div>
<div id="stage">
  <canvas id="c"></canvas>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── State ────────────────────────────────────────────────
let resolution = 1;   // 1–10
let animOn     = true;

// Res 1: row selection (1–10)
let lv = null, rv = null;

// Res 2+: slider values (1 to resolution*10), default 1
let lSlider = 1, rSlider = 1;

function lVal() {
  if (resolution === 1) return lv;
  return lSlider;
}
function rVal() {
  if (resolution === 1) return rv;
  return rSlider;
}

// ── Fonts / colors ───────────────────────────────────────
function numFont()    { return `900 ${Math.round(ROW_H * 0.78)}px Georgia, serif`; }
function circleFont() { return `900 ${Math.round(ROW_H * 0.5)}px Georgia, serif`; }
function lblFont()    { return `700 ${Math.max(9, Math.round(ROW_H * 0.16))}px 'Courier New', monospace`; }
function ratioFont()  { 
  const size = Math.min(Math.round(ROW_H * 0.52), Math.round(ringR * 0.7));
  return `700 ${size}px Georgia, serif`; 
}
function slashFont()  { 
  const size = Math.min(Math.round(ROW_H * 0.72), Math.round(ringR * 0.9));
  return `300 ${size}px Georgia, serif`; 
}
function valFont()    { return `700 ${Math.round(ROW_H * 0.65)}px Georgia, serif`; }

const NUM_COLOR  = "#1a1a1a";
const SEL_COLOR  = "#cc2200";
const LBL_COLOR  = "#999";
const TRACK_COLOR = "#ccc";
const NUM_COUNT  = 10;
let   ROW_H      = 68;

// ── Layout ───────────────────────────────────────────────
let W, H, colLX, colRX, centerX, centerY, ringR, rowTop;
let sliderTop, sliderBot, sliderX_L, sliderX_R, sliderW;

function resize() {
  const dpr  = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = rect.width; H = rect.height;
  const padding = 20;
  ROW_H    = Math.floor((H - padding * 2) / NUM_COUNT);
  rowTop   = padding;
  centerX  = W / 2;
  centerY  = H / 2;
  ringR    = Math.min(72, ROW_H * 0.95);
  const gap = Math.max(40, ringR - 5);
  colLX    = centerX - ringR - gap;
  colRX    = centerX + ringR + gap;

  sliderTop = rowTop + ROW_H / 2;
  sliderBot = rowTop + (NUM_COUNT - 1) * ROW_H + ROW_H / 2;
  sliderW   = 44;
  sliderX_L = colLX - 26;
  sliderX_R = colRX + 26;
}

function rowCenterY(n) {
  return rowTop + (NUM_COUNT - n) * ROW_H + ROW_H / 2;
}

// Each slot represents 10 units. Slot 0 = max (top), slot resolution = 1 (bottom).
// value 50 at res5 → slot 0. value 40 → slot 1. value 1 → slot 5 (= resolution).
// For values between decades, interpolate fractionally between slots.
function valToY(val) {
  const max        = resolution * 10;
  const totalSlots = resolution + 1;
  const slotH      = (sliderBot - sliderTop) / (totalSlots - 1);
  if (val <= 1)   return sliderTop + (totalSlots - 1) * slotH; // = sliderBot exactly
  if (val >= max) return sliderTop;
  const slotIndex  = (max - val) / 10;
  return sliderTop + slotIndex * slotH;
}

function yToVal(y) {
  const max        = resolution * 10;
  const totalSlots = resolution + 1;
  const slotH      = (sliderBot - sliderTop) / (totalSlots - 1);
  const clampedY   = Math.max(sliderTop, Math.min(sliderBot, y));
  const slotIndex  = (clampedY - sliderTop) / slotH;
  const val        = max - slotIndex * 10;
  return Math.max(1, Math.min(max, Math.round(val)));
}

// ── Animation ────────────────────────────────────────────
const pulses = {};
let ringSpring = { scale: 1, vel: 0 };
let orbitAngle = 0, orbitActive = false;
let rafId = null, lastT = null;

function startLoop() {
  if (rafId) return;
  lastT = null;
  function loop(t) {
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0;
    lastT = t;
    update(dt); draw();
    if (!isSettled()) rafId = requestAnimationFrame(loop);
    else              rafId = null;
  }
  rafId = requestAnimationFrame(loop);
}
function isSettled() {
  if (Object.keys(pulses).length) return false;
  if (Math.abs(ringSpring.vel) > 0.001 || Math.abs(ringSpring.scale - 1) > 0.001) return false;
  if (orbitActive && animOn) return false;
  return true;
}
function update(dt) {
  for (const key of Object.keys(pulses)) {
    const p = pulses[key];
    const t = Math.min((performance.now() - p.start) / 350, 1);
    if (t >= 1) { delete pulses[key]; continue; }
    p.scale = 1 + 0.18 * Math.sin(t * Math.PI) * Math.pow(1 - t, 0.5);
  }
  const disp = ringSpring.scale - 1;
  const acc  = -280 * disp - 18 * ringSpring.vel;
  ringSpring.vel += acc * dt; ringSpring.scale += ringSpring.vel * dt;
  if (orbitActive && animOn) orbitAngle = (orbitAngle + dt * 1.4) % (Math.PI * 2);
}
function triggerPulse(key) { if (!animOn) return; pulses[key] = { start: performance.now(), scale: 1 }; }
function triggerRing(both) { if (!animOn) return; ringSpring.vel = both ? 12 : 6; }

// ── Draw: res 1 column number ────────────────────────────
function drawNum(n, cx, cy, selected, scale) {
  const color = selected ? SEL_COLOR : NUM_COLOR;
  ctx.save();
  ctx.translate(cx, cy);
  if (scale && scale !== 1) ctx.scale(scale, scale);
  if (n === NUM_COUNT) {
    const r = Math.round(ROW_H * 0.36);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.font = circleFont(); ctx.fillStyle = color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('1', 0, 0);
  } else {
    ctx.font = numFont(); ctx.fillStyle = color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const yOffset = n === 1 ? -Math.round(ROW_H * 0.12) : 0;
    ctx.fillText(String(n), 0, yOffset);
  }
  ctx.restore();
}

function drawLabel(text, x, y, selected, align) {
  ctx.font = lblFont();
  ctx.fillStyle = selected ? SEL_COLOR : LBL_COLOR;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

// ── Draw: slider column for res > 1 ─────────────────────
function drawSlider(side) {
  const cx      = side === 'L' ? sliderX_L : sliderX_R;
  const val     = side === 'L' ? lSlider   : rSlider;
  const max     = resolution * 10;
  const handleR = Math.round(ROW_H * 0.22);
  const circR   = Math.round(ROW_H * 0.36); // radius for decade circles
  const bot1R   = Math.round(ROW_H * 0.46); // larger radius for bottom 1 to fit numFont
  const hy      = valToY(val);

  // Slots: index 0 = top (resolution), index 1..res-1 = decade markers, index res = bottom (1)
  // Total = resolution + 1
  const totalSlots = resolution + 1;
  const slotH      = (sliderBot - sliderTop) / (totalSlots - 1);
  function slotY(i) { return sliderTop + i * slotH; }

  // ── Track: ends at sliderBot where bottom 1 sits ──
  ctx.strokeStyle = TRACK_COLOR; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, sliderTop); ctx.lineTo(cx, sliderBot); ctx.stroke();

  // ── Decade circles (all slots except bottom) ──
  for (let i = 0; i < totalSlots - 1; i++) {
    const cy     = slotY(i);
    const isTop  = i === 0;
    const decadeVal = totalSlots - 1 - i;
    const label  = decadeVal === 10 ? '1' : String(decadeVal);
    const color  = isTop ? NUM_COLOR : '#bbb';

    ctx.beginPath(); ctx.arc(cx, cy, circR, 0, Math.PI * 2);
    ctx.fillStyle = '#f4f3f0'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = isTop ? 2 : 1.5; ctx.stroke();

    if (isTop && resolution === 10) {
      ctx.beginPath(); ctx.arc(cx, cy, circR + 6, 0, Math.PI * 2);
      ctx.strokeStyle = NUM_COLOR; ctx.lineWidth = 1.5; ctx.stroke();
    }

    ctx.font = circleFont(); ctx.fillStyle = color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy);
  }

  // ── Bottom 1: measure glyph, position so bottom of glyph = sliderBot ──
  ctx.font = numFont();
  const m1  = ctx.measureText('1');
  const glyphH = (m1.actualBoundingBoxAscent || 0) + (m1.actualBoundingBoxDescent || 0);
  const botY   = sliderBot - (m1.actualBoundingBoxDescent || 0);
  // Background wipe
  ctx.fillStyle = '#f4f3f0';
  ctx.fillRect(cx - bot1R, sliderBot - glyphH - 4, bot1R * 2, glyphH + 8);
  ctx.font = numFont(); ctx.fillStyle = NUM_COLOR;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('1', cx, sliderBot);

  // ── Handle ──
  ctx.beginPath(); ctx.arc(cx, hy, handleR, 0, Math.PI * 2);
  ctx.fillStyle = SEL_COLOR; ctx.fill();

  let handleText;
  const roundedVal = Math.round(val);
  if (roundedVal % 10 === 0) {
    const decade = roundedVal / 10;
    handleText = decade === 10 ? '((1))' : `(${decade})`;
  } else {
    handleText = String(roundedVal);
  }
  ctx.font = `700 ${Math.round(handleR * (roundedVal % 10 === 0 ? 0.7 : 1.1))}px Georgia, serif`;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(handleText, cx, hy);
}

// ── Draw ratio ───────────────────────────────────────────
function drawRatio() {
  const cx = centerX, cy = centerY;
  const rs = ringSpring.scale;

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(rs, rs);
  ctx.beginPath(); ctx.arc(0, 0, ringR, 0, Math.PI * 2);
  ctx.strokeStyle = NUM_COLOR; ctx.lineWidth = 2.5; ctx.stroke();
  if (orbitActive && animOn) {
    const arcLen = Math.PI * 0.55;
    ctx.beginPath(); ctx.arc(0, 0, ringR, orbitAngle, orbitAngle + arcLen);
    ctx.strokeStyle = 'rgba(26,26,26,0.22)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, ringR, orbitAngle + Math.PI, orbitAngle + Math.PI + arcLen);
    ctx.strokeStyle = 'rgba(26,26,26,0.12)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();

  const lvA = lVal(), rvA = rVal();
  if (lvA === null && rvA === null) {
    ctx.font = slashFont(); ctx.fillStyle = '#bbb';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('—/—', cx, cy); return;
  }

  let offset = null, rational = null;
  if (lvA !== null && rvA !== null) {
    const lo = Math.min(lvA, rvA), hi = Math.max(lvA, rvA);
    const gap = hi - lo - 1;
    offset   = gap > 0 ? gap : null;
    rational = hi - lo + 1;
  } else if (rvA !== null && lvA === null) {
    rational = rvA;
  }

  function otom(n) {
    if (n === null) return '—';
    if (n % 10 === 0) {
      const d = n / 10;
      return d === 10 ? '((1))' : `(${d})`;
    }
    return String(n);
  }

  const offStr = otom(offset);
  const ratStr = otom(rational);
  const largest = (offset !== null && rational !== null)
    ? (offset >= rational ? 'off' : 'rat') : null;

  // Find the largest font size where everything fits inside the ring
  const maxW = ringR * 1.7; // usable width inside circle
  let fontSize = Math.min(Math.round(ROW_H * 0.52), Math.round(ringR * 0.7));
  let offW, ratW, slashW, totalW;
  for (let tries = 0; tries < 20; tries++) {
    ctx.font = `700 ${fontSize}px Georgia, serif`;
    offW   = ctx.measureText(offStr).width;
    ratW   = ctx.measureText(ratStr).width;
    const slashSize = Math.round(fontSize * 1.3);
    ctx.font = `300 ${slashSize}px Georgia, serif`;
    slashW = ctx.measureText('/').width;
    totalW = offW + slashW + ratW + 8;
    if (totalW <= maxW) break;
    fontSize = Math.max(8, fontSize - 2);
  }
  const slashSize = Math.round(fontSize * 1.3);
  const startX = cx - totalW / 2;

  ctx.font = `700 ${fontSize}px Georgia, serif`;
  ctx.fillStyle = NUM_COLOR; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(offStr, startX, cy);
  if (largest === 'off' && offset !== null) {
    const m = ctx.measureText(offStr);
    const uly = cy + (m.actualBoundingBoxDescent || fontSize * 0.2) + 2;
    ctx.beginPath(); ctx.strokeStyle = NUM_COLOR; ctx.lineWidth = 1.5;
    ctx.moveTo(startX, uly); ctx.lineTo(startX + offW, uly); ctx.stroke();
  }

  ctx.font = `300 ${slashSize}px Georgia, serif`;
  ctx.fillStyle = NUM_COLOR; ctx.textAlign = 'left';
  const slashX = startX + offW + 2;
  ctx.fillText('/', slashX, cy);

  ctx.font = `700 ${fontSize}px Georgia, serif`;
  ctx.fillStyle = NUM_COLOR; ctx.textAlign = 'left';
  const ratX = slashX + slashW + 2;
  ctx.fillText(ratStr, ratX, cy);
  if (largest === 'rat' && rational !== null) {
    const m = ctx.measureText(ratStr);
    const uly = cy + (m.actualBoundingBoxDescent || fontSize * 0.2) + 2;
    ctx.beginPath(); ctx.strokeStyle = NUM_COLOR; ctx.lineWidth = 1.5;
    ctx.moveTo(ratX, uly); ctx.lineTo(ratX + ratW, uly); ctx.stroke();
  }
}

// ── Main draw ────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  if (resolution === 1) {
    // Standard clickable columns
    for (let n = 1; n <= NUM_COUNT; n++) {
      const cy    = rowCenterY(n);
      const selL  = lv === n, selR = rv === n;
      const scaleL = pulses['L'+n] ? pulses['L'+n].scale : 1;
      const scaleR = pulses['R'+n] ? pulses['R'+n].scale : 1;

      drawNum(n, colLX - 26, cy, selL, scaleL);
      drawNum(n, colRX + 26, cy, selR, scaleR);

      const isTop = n === NUM_COUNT;
      const circR = Math.round(ROW_H * 0.46);
      let halfW;
      if (isTop) { halfW = circR + 14; }
      else { ctx.font = numFont(); halfW = ctx.measureText(String(n)).width / 2 + 10; }

      const labelY = cy + (n === 1 ? -Math.round(ROW_H * 0.12) : 0);
      drawLabel(selL ? 'Whole' : 'Whole,N', colLX - 26 - halfW - 6, labelY, selL, 'right');
      drawLabel(selR ? 'Whole' : 'Whole,N', colRX + 26 + halfW + 6, labelY, selR, 'left');
    }
  } else {
    // Slider columns
    drawSlider('L');
    drawSlider('R');
  }

  drawRatio();
}

// ── Input: res 1 click ───────────────────────────────────
canvas.addEventListener('click', e => {
  if (resolution !== 1) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (let n = 1; n <= NUM_COUNT; n++) {
    const cy = rowCenterY(n);
    if (mx >= colLX - 52 && mx <= colLX + 4 && Math.abs(my - cy) <= ROW_H / 2) {
      lv = (lv === n) ? null : n;
      const both = lv !== null && rv !== null;
      triggerPulse('L'+n); triggerRing(both);
      orbitActive = both; startLoop(); return;
    }
    if (mx >= colRX - 4 && mx <= colRX + 52 && Math.abs(my - cy) <= ROW_H / 2) {
      rv = (rv === n) ? null : n;
      const both = lv !== null && rv !== null;
      triggerPulse('R'+n); triggerRing(both);
      orbitActive = both; startLoop(); return;
    }
  }
});

// ── Input: slider drag ───────────────────────────────────
let dragging = null; // 'L' | 'R' | null

function clampVal(v) { return Math.max(1, Math.min(resolution * 10, v)); }

function sliderPointerDown(e) {
  if (resolution === 1) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const tw = sliderW;
  if (Math.abs(mx - sliderX_L) <= tw && my >= sliderTop && my <= sliderBot) dragging = 'L';
  else if (Math.abs(mx - sliderX_R) <= tw && my >= sliderTop && my <= sliderBot) dragging = 'R';
  if (dragging) { updateSlider(e); e.preventDefault(); }
}

function updateSlider(e) {
  if (!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const my = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const val = clampVal(yToVal(my));
  if (dragging === 'L') lSlider = val;
  else                  rSlider = val;
  const both = true; // sliders always have a value
  triggerRing(lSlider !== 1 || rSlider !== 1 ? true : false);
  orbitActive = animOn;
  startLoop();
}

function sliderPointerUp() {
  dragging = null;
  orbitActive = animOn && (resolution > 1 || (lv !== null && rv !== null));
}

canvas.addEventListener('mousedown',  sliderPointerDown);
canvas.addEventListener('mousemove',  e => { if (dragging) { updateSlider(e); e.preventDefault(); } });
canvas.addEventListener('mouseup',    sliderPointerUp);
canvas.addEventListener('touchstart', sliderPointerDown, { passive: false });
canvas.addEventListener('touchmove',  e => { if (dragging) { updateSlider(e); e.preventDefault(); } }, { passive: false });
canvas.addEventListener('touchend',   sliderPointerUp);

// ── Resolution button ────────────────────────────────────
document.getElementById('resBtn').addEventListener('click', () => {
  resolution = resolution >= 10 ? 1 : resolution + 1;
  lv = null; rv = null;
  lSlider = 1; rSlider = 1;
  orbitActive = false;
  const label = resolution === 10 ? 'RES ((1))' : `RES (${resolution})`;
  document.getElementById('resBtn').textContent = label;
  draw();
});

// ── Anim toggle ──────────────────────────────────────────
document.getElementById('animBtn').addEventListener('click', () => {
  animOn = !animOn;
  const b = document.getElementById('animBtn');
  b.textContent = animOn ? 'ANIM ON' : 'ANIM OFF';
  b.classList.toggle('off', !animOn);
  if (!animOn) orbitActive = false;
  startLoop();
});

// ── Init ─────────────────────────────────────────────────
let resizeTimer = null;
function onResize() {
  if (resizeTimer) cancelAnimationFrame(resizeTimer);
  resizeTimer = requestAnimationFrame(() => { resize(); draw(); });
}
const ro = new ResizeObserver(onResize);
ro.observe(document.getElementById('stage'));
(function watchZoom() {
  const mql = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
  mql.addEventListener('change', () => { onResize(); watchZoom(); }, { once: true });
})();
resize();
draw();
</script>
</body>
</html>
